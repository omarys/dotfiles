maximized = false
# Disable temporary ext_messages/ext_cmdline capture at startup, which makes
# noice.nvim refuse to initialize ("Noice can't work when the GUI has ext_...").
startup-message-capture = false
mouse-cursor-icon = "arrow"

[font]
normal = ["CaskaydiaCove Nerd Font Mono"]
size = 14.0

[box-drawing]
mode = "font-glyph"

[box-drawing.sizes]
default = [2, 4]
