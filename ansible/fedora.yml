- name: Provision Fedora Workstation
  hosts: localhost
  connection: local
  become: false
  vars:
    user_name: "{{ ansible_facts['user_id'] | default('omary') }}"
    user_home: "{{ ansible_facts['env']['HOME'] | default('/home/' + user_name) }}"
    user_env:
      PATH: "{{ user_home }}/.local/bin:{{ user_home }}/.cargo/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
      NONINTERACTIVE: "1"
    font_version: "v3.4.0"
    core_packages:
      - "@development-tools"
      - cairo-gobject-devel
      - cargo
      - chafa
      - clang-devel
      - cmake
      - curl
      - dnf-plugins-core
      - file
      - fontconfig-devel
      - freetype-devel
      - fzf
      - gdk-pixbuf2-devel
      - git
      - git
      - gnome-tweaks
      - gnupg2
      - graphene-devel
      - gtk4-devel
      - keepassxc
      - libadwaita-devel
      - libstdc++-static
      - make
      - mpv
      - openssl-devel
      - pango-devel
      - pcre2-devel
      - pkgconf-pkg-config
      - python3-neovim
      - ripgrep
      - rust
      - stow
      - syncthing
      - unzip
      - util-linux-user
      - zsh
    # GUI Applications via Flatpak (Flathub User/System)
    flatpak_packages:
      - com.mattermost.Desktop
      - info.febvre.Komikku
      - org.gnome.Aisleriot
      - org.gnome.Mahjongg
      - org.gnome.Podcasts
      - org.gnome.Solanum
      - us.zoom.Zoom
    # Rust CLI Tools via Cargo
    cargo_packages:
      - bat
      - bottom
      - broot
      - cargo-update
      - dysk
      - emacs-lsp-booster
      - fd-find
      - git-delta
      - hoard-rs
      - leaf-markdown-viewer
      - lsd
      - rm-improved
      - sd
      - starship
      - tealdeer
      - tree-sitter-cli
      - zoxide
  tasks:
    # =========================================================================
    # 1. System Packages & Repositories (DNF, RPM Fusion, Terra, Ghostty)
    # =========================================================================
    - name: 1. Install System Repositories and Core Packages
      become: true
      block:
        - name: Install RPM Fusion Free
          ansible.builtin.dnf:
            name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
            state: present
            disable_gpg_check: true
        - name: Install RPM Fusion Non-Free
          ansible.builtin.dnf:
            name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
            state: present
            disable_gpg_check: true
        - name: Add Terra Repository
          ansible.builtin.get_url:
            url: https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
            dest: /etc/yum.repos.d/terra.repo
            mode: "0644"
        - name: Install Terra Release Package
          ansible.builtin.dnf:
            name: terra-release
            state: present
            update_cache: true
        - name: Install Development Tools Group
          ansible.builtin.dnf:
            name: "@development-tools"
            state: present
        - name: Install System Packages
          ansible.builtin.dnf:
            name: "{{ core_packages }}"
            state: present
    # =========================================================================
    # 2. Flatpak Applications & Standalone Firefox
    # =========================================================================
    - name: 2. Install GUI Applications via Flatpak
      block:
        - name: Ensure Flatpak package manager is installed
          become: true
          ansible.builtin.dnf:
            name: flatpak
            state: present
        - name: Ensure Flathub repository is configured
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
            method: user
        - name: Install Flatpak applications
          community.general.flatpak:
            name: "{{ item }}"
            state: present
            remote: flathub
            method: user
          loop: "{{ flatpak_packages }}"
        - name: Remove Flatpak KeePassXC (in favor of RPM KeePassXC)
          community.general.flatpak:
            name: org.keepassxc.KeePassXC
            state: absent
            method: "{{ item }}"
          loop:
            - system
            - user
          failed_when: false
    # =========================================================================
    # 3. Mise Installation and Scoped Toolchains
    # =========================================================================
    - name: 3. Configure Mise & Pre-Commit Dependencies
      block:
        - name: Check if Mise is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/bin/mise"
          register: mise_bin_check
        - name: Install Mise via official standalone installer # noqa: command-instead-of-module
          ansible.builtin.shell:
            cmd: set -o pipefail && curl -fsSL https://mise.run | sh
            executable: /bin/bash
          changed_when: true
          when: not mise_bin_check.stat.exists
    # =========================================================================
    # 4. User Environment (Fonts, Oh-My-Zsh, Tmux, CLI Tools)
    # =========================================================================
    - name: 4. Configure User Shell & Fonts
      block:
        - name: Create font directory
          ansible.builtin.file:
            path: "{{ user_home }}/.local/share/fonts"
            state: directory
            mode: "0755"
          check_mode: false
        - name: Install Cascadia Code Nerd Font
          ansible.builtin.unarchive:
            src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ font_version }}/CascadiaCode.zip"
            dest: "{{ user_home }}/.local/share/fonts"
            remote_src: true
            mode: "0644"
        - name: Clone Oh-My-Zsh
          ansible.builtin.git:
            repo: https://github.com/ohmyzsh/ohmyzsh.git
            dest: "{{ user_home }}/.oh-my-zsh"
            depth: 1
            version: master
            update: false
        - name: Clone zsh-autosuggestions
          ansible.builtin.git:
            repo: https://github.com/zsh-users/zsh-autosuggestions
            dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
            depth: 1
            version: master
            update: false
        - name: Install Tmux Package Manager (TPM)
          ansible.builtin.git:
            repo: https://github.com/tmux-plugins/tpm
            dest: "{{ user_home }}/.config/tmux/plugins/tpm"
            depth: 1
            version: master
            update: false
        - name: Ensure tmux configuration directory exists
          ansible.builtin.file:
            path: "{{ user_home }}/.config/tmux"
            state: directory
            mode: "0755"
        - name: Ensure minimal TPM configuration exists in tmux.conf
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.config/tmux/tmux.conf"
            line: "set -g @plugin 'tmux-plugins/tpm'"
            create: true
            mode: "0644"
        - name: Execute headless TPM plugin installation
          ansible.builtin.command:
            cmd: "{{ user_home }}/.config/tmux/plugins/tpm/bin/install_plugins"
          environment:
            TMUX_PLUGIN_MANAGER_PATH: "{{ user_home }}/.config/tmux/plugins"
          register: tpm_install
          changed_when: "'Installing' in tpm_install.stdout"
          failed_when: false
        - name: Install Cargo CLI packages
          community.general.cargo:
            name: "{{ item }}"
            state: present
          loop: "{{ cargo_packages }}"
        - name: Install Ripgrep with pcre2 support
          ansible.builtin.command:
            cmd: "cargo install ripgrep --features pcre2"
          args:
            creates: "{{ user_home }}/.cargo/bin/rg"
        - name: Install Neovide from git in Toolbox
          ansible.builtin.command:
            cmd: "cargo install --git https://github.com/neovide/neovide"
          args:
            creates: "{{ user_home }}/.cargo/bin/neovide"
        - name: Create global npm directory
          ansible.builtin.file:
            path: "{{ user_home }}/.npm-global"
            state: directory
            mode: "0755"
          check_mode: false
        - name: Configure NPM Prefix
          ansible.builtin.command:
            cmd: "npm config set prefix '~/.npm-global'"
          changed_when: false
        - name: Install pi and codex CLI agents via npm
          ansible.builtin.command:
            cmd: "npm install -g @earendil-works/pi-coding-agent @openai/codex"
          environment:
            PATH: "{{ user_home }}/.npm-global/bin:{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
          register: npm_agents
          changed_when: "'added' in npm_agents.stdout or 'updated' in npm_agents.stdout"
        - name: Check if Antigravity CLI (agy) is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/bin/agy"
          register: agy_bin_check
        - name: Install Antigravity CLI (agy) # noqa: command-instead-of-module
          ansible.builtin.shell:
            cmd: set -o pipefail && curl -fsSL https://antigravity.google/install.sh | sh
            executable: /bin/bash
          changed_when: true
          when: not agy_bin_check.stat.exists
        - name: Ensure mise activation in .zshrc
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.zshrc"
            line: 'eval "$({{ user_home }}/.local/bin/mise activate zsh)"'
            create: true
            state: present
            mode: "0644"
