- name: Provision Fedora Workstation
  hosts: localhost
  connection: local
  become: false
  vars:
    user_name: "{{ ansible_facts['user_id'] | default('omary') }}"
    user_home: "{{ ansible_facts['env']['HOME'] | default('/home/' + user_name) }}"
    system_user_path: "{{ user_home }}/.npm-global/bin:{{ user_home }}/.cargo/bin:{{ user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    user_env:
      PATH: "{{ system_user_path }}:/home/linuxbrew/.linuxbrew/bin"
      NONINTERACTIVE: "1"
    font_version: "v3.4.0"
    core_packages:
      - chafa
      - curl
      - file
      - fontconfig
      - freetype
      - fzf
      - git
      - gnome-tweaks
      - gnupg2
      - keepassxc
      - mpv
      - pass
      - ripgrep
      - stow
      - syncthing
      - tmux
      - unzip
      - util-linux-user
      - zsh
    # GUI Applications via Flatpak (Flathub User/System)
    flatpak_packages:
      - info.febvre.Komikku
      - org.gnome.Aisleriot
      - org.gnome.Mahjongg
      - org.gnome.Podcasts
      - org.gnome.Solanum
      - us.zoom.Zoom
    # Rust/Cargo Toolbox Container Isolation
    toolbox_container_name: "rust-toolbox"
    toolbox_build_packages:
      - "@development-tools"
      - cargo
      - clang-devel
      - cmake
      - fontconfig-devel
      - freetype-devel
      - git
      - libstdc++-static
      - make
      - openssl-devel
      - pcre2-devel
      - pkgconf-pkg-config
      - rust
    # Rust CLI Tools via Cargo (built inside Toolbox into ~/.cargo/bin)
    cargo_packages:
      - name: bat
        binary: bat
      - name: bottom
        binary: btm
      - name: cargo-update
        binary: cargo-install-update
      - name: dysk
        binary: dysk
      - name: fd-find
        binary: fd
      - name: git-delta
        binary: delta
      - name: hoard-rs
        binary: hoard
      - name: leaf-markdown-viewer
        binary: leaf
      - name: lsd
        binary: lsd
      - name: rm-improved
        binary: rip
      - name: sd
        binary: sd
      - name: starship
        binary: starship
      - name: tealdeer
        binary: tldr
      - name: tree-sitter-cli
        binary: tree-sitter
      - name: zoxide
        binary: zoxide
        # # Homebrew fallback packages (only those not covered by mise or cargo)
        # homebrew_packages:
        #   - docker-credential-helper
        #   - ksops
  tasks:
    # =========================================================================
    # 1. System Packages & Repositories (DNF, RPM Fusion, Terra, Ghostty)
    # =========================================================================
    - name: 1. Install System Repositories and Core Packages
      become: true
      block:
        - name: Check rpm-ostree deployment status
          ansible.builtin.command:
            cmd: rpm-ostree status --json
          register: rpm_ostree_status
          changed_when: false
        - name: Install RPM Fusion repositories
          ansible.builtin.command:
            cmd: >-
              rpm-ostree install https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
          register: rpmfusion_install
          changed_when: rpmfusion_install.rc == 0
          when: >-
            'rpmfusion-free-release' not in rpm_ostree_status.stdout or 'rpmfusion-nonfree-release' not in rpm_ostree_status.stdout
        - name: Add Terra Repository
          ansible.builtin.get_url:
            url: https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
            dest: /etc/yum.repos.d/terra.repo
            mode: "0644"
        - name: Install Terra Release Package
          community.general.rpm_ostree_pkg:
            name: terra-release
            state: present
        - name: Install System Packages
          community.general.rpm_ostree_pkg:
            name: "{{ core_packages }}"
            state: present
    # =========================================================================
    # 2. Rust/Cargo Toolbox Container & Isolated Build Environment
    # =========================================================================
    - name: 2. Configure Rust/Cargo Toolbox Container & Build CLI Tools
      block:
        - name: Check existing Toolbox containers
          ansible.builtin.command:
            cmd: toolbox list -c
          register: toolbox_list_check
          changed_when: false
        - name: Create Rust/Cargo Toolbox container
          ansible.builtin.command:
            cmd: "toolbox -y create {{ toolbox_container_name }}"
          when: toolbox_container_name not in toolbox_list_check.stdout
        - name: Check if build dependencies are installed in Toolbox
          ansible.builtin.command:
            cmd: >-
              toolbox run -c {{ toolbox_container_name }} rpm -q {{ toolbox_build_packages


                 | reject('match', '^@')
                 | map('quote')
                 | join(' ') }}
          register: toolbox_pkgs_check
          failed_when: false
          changed_when: false
        - name: Install build dependencies in Toolbox container
          ansible.builtin.command:
            cmd: >-
              toolbox run -c {{ toolbox_container_name }} sudo dnf5 install -y {{ toolbox_build_packages | map('quote') | join(' ') }}
          when: toolbox_pkgs_check.rc != 0
        - name: Ensure ~/.local/bin directory exists
          ansible.builtin.file:
            path: "{{ user_home }}/.local/bin"
            state: directory
            mode: "0755"
          check_mode: false
        # Older revisions of this playbook created ~/.local/bin/cargo as a
        # Toolbox wrapper. Because Toolbox shares the user's HOME and PATH,
        # that wrapper recursively invoked toolbox -> cargo -> toolbox.
        - name: Remove obsolete recursive Cargo wrapper
          ansible.builtin.file:
            path: "{{ user_home }}/.local/bin/cargo"
            state: absent
        - name: Verify Rust Toolbox container is usable
          ansible.builtin.command:
            cmd: "toolbox run -c {{ toolbox_container_name }} /usr/bin/true"
          register: toolbox_health
          changed_when: false
        - name: Verify Toolbox uses the packaged Cargo binary
          ansible.builtin.command:
            cmd: "toolbox run -c {{ toolbox_container_name }} /usr/bin/cargo --version"
          register: toolbox_cargo_version
          changed_when: false
        - name: Ensure Cargo bin directory exists in shared home
          ansible.builtin.file:
            path: "{{ user_home }}/.cargo/bin"
            state: directory
            mode: "0755"
        - name: Install Cargo CLI packages in Toolbox
          ansible.builtin.command:
            cmd: >-
              toolbox run -c {{ toolbox_container_name }} env CARGO_BUILD_JOBS=1 CARGO_INCREMENTAL=0 RAYON_NUM_THREADS=1 CARGO_HOME={{ user_home }}/.cargo TMPDIR=/var/tmp /usr/bin/cargo install --jobs 1 {{ item.name }}
          args:
            creates: "{{ user_home }}/.cargo/bin/{{ item.binary }}"
          loop: "{{ cargo_packages }}"
        - name: Install Ripgrep with pcre2 support in Toolbox
          ansible.builtin.command:
            cmd: >-
              toolbox run -c {{ toolbox_container_name }} env CARGO_BUILD_JOBS=1 CARGO_INCREMENTAL=0 RAYON_NUM_THREADS=1 CARGO_HOME={{ user_home }}/.cargo TMPDIR=/var/tmp /usr/bin/cargo install --jobs 1 ripgrep --features pcre2
          args:
            creates: "{{ user_home }}/.cargo/bin/rg"
        - name: Install Neovide from git in Toolbox
          ansible.builtin.command:
            cmd: >-
              toolbox run -c {{ toolbox_container_name }} env CARGO_BUILD_JOBS=1 CARGO_INCREMENTAL=0 RAYON_NUM_THREADS=1 CARGO_HOME={{ user_home }}/.cargo TMPDIR=/var/tmp /usr/bin/cargo install --jobs 1 --git https://github.com/neovide/neovide
          args:
            creates: "{{ user_home }}/.cargo/bin/neovide"
        - name: Install Yazi from git source in Toolbox
          ansible.builtin.command:
            cmd: >-
              toolbox run -c {{ toolbox_container_name }} env CARGO_BUILD_JOBS=1 CARGO_INCREMENTAL=0 RAYON_NUM_THREADS=1 CARGO_HOME={{ user_home }}/.cargo TMPDIR=/var/tmp /usr/bin/cargo install --jobs 1 --force --git https://github.com/sxyazi/yazi.git yazi-build
          args:
            creates: "{{ user_home }}/.cargo/bin/yazi"
        - name: Verify Cargo-installed binaries are present in shared home
          ansible.builtin.stat:
            path: "{{ user_home }}/.cargo/bin/{{ item.binary }}"
          register: cargo_binary_stats
          loop: "{{ cargo_packages }}"
        - name: Assert Cargo-installed binaries are available to the host
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.executable
            fail_msg: "Expected host-visible Cargo binary is missing or not executable: {{ item.item.binary }}"
          loop: "{{ cargo_binary_stats.results }}"
    # =========================================================================
    # 3. Flatpak Applications & Standalone Firefox
    # =========================================================================
    - name: 3. Install GUI Applications via Flatpak
      block:
        - name: Verify Flatpak is available
          ansible.builtin.command:
            cmd: flatpak --version
          changed_when: false
        - name: Ensure Flathub repository is configured
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
            method: user
        - name: Install Flatpak applications
          community.general.flatpak:
            name: "{{ item }}"
            state: present
            remote: flathub
            method: user
          loop: "{{ flatpak_packages }}"
        - name: Remove default Flatpak Firefox (in favor of Standalone Native Firefox)
          community.general.flatpak:
            name: org.mozilla.firefox
            state: absent
            method: "{{ item }}"
          loop:
            - system
            - user
          ignore_errors: true
        - name: Remove Flatpak KeePassXC (in favor of RPM KeePassXC)
          community.general.flatpak:
            name: org.keepassxc.KeePassXC
            state: absent
            method: "{{ item }}"
          loop:
            - system
            - user
          ignore_errors: true
    - name: Configure Mozilla Firefox (Standalone Native Edition)
      block:
        - name: Ensure ~/.local directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ user_home }}/.local/lib"
            - "{{ user_home }}/.local/bin"
            - "{{ user_home }}/.local/share/applications"
          check_mode: false
        - name: Check if Standalone Firefox is already installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/lib/firefox/firefox"
          register: firefox_bin_check
        - name: Download and Extract Mozilla Firefox Standalone
          ansible.builtin.unarchive:
            src: "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
            dest: "{{ user_home }}/.local/lib"
            remote_src: true
            creates: "{{ user_home }}/.local/lib/firefox/firefox"
          when: not firefox_bin_check.stat.exists
        - name: Symlink Firefox executable to ~/.local/bin/firefox
          ansible.builtin.file:
            src: "{{ user_home }}/.local/lib/firefox/firefox"
            dest: "{{ user_home }}/.local/bin/firefox"
            state: link
            force: true
        - name: Create Desktop Entry for Standalone Firefox
          ansible.builtin.copy:
            dest: "{{ user_home }}/.local/share/applications/firefox.desktop"
            mode: "0644"
            content: |
              [Desktop Entry]
              Version=1.0
              Name=Firefox
              Comment=Browse the World Wide Web
              GenericName=Web Browser
              Keywords=Internet;WWW;Browser;Web;Explorer
              Exec={{ user_home }}/.local/bin/firefox %u
              Terminal=false
              X-MultipleArgs=false
              Type=Application
              Icon={{ user_home }}/.local/lib/firefox/browser/chrome/icons/default/default128.png
              Categories=Network;WebBrowser;
              MimeType=text/html;text/xml;application/xhtml+xml;application/xml;application/rss+xml;application/rdf+xml;image/gif;image/jpeg;image/png;x-scheme-handler/http;x-scheme-handler/https;x-scheme-handler/ftp;x-scheme-handler/chrome;video/webm;application/x-xpinstall;
              StartupNotify=true
              StartupWMClass=firefox
              Actions=new-window;new-private-window;

              [Desktop Action new-window]
              Name=Open a New Window
              Exec={{ user_home }}/.local/bin/firefox -new-window

              [Desktop Action new-private-window]
              Name=Open a New Private Window
              Exec={{ user_home }}/.local/bin/firefox -private-window
        - name: Ensure ~/.mozilla/native-messaging-hosts directory exists
          ansible.builtin.file:
            path: "{{ user_home }}/.mozilla/native-messaging-hosts"
            state: directory
            mode: "0755"
          check_mode: false
        - name: Configure KeePassXC Native Messaging Host for Mozilla Firefox
          ansible.builtin.copy:
            dest: "{{ user_home }}/.mozilla/native-messaging-hosts/org.keepassxc.keepassxc_browser.json"
            mode: "0644"
            content: |
              {
                  "allowed_extensions": [
                      "keepassxc-browser@keepassxc.org"
                  ],
                  "description": "KeePassXC integration with native messaging support",
                  "name": "org.keepassxc.keepassxc_browser",
                  "path": "/usr/bin/keepassxc-proxy",
                  "type": "stdio"
              }
    # =========================================================================
    # 4. Mise Installation and Scoped Toolchains
    # =========================================================================
    - name: 4. Configure Mise & Pre-Commit Dependencies
      block:
        - name: Check if Mise is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/bin/mise"
          register: mise_bin_check
        - name: Install Mise via official standalone installer
          ansible.builtin.shell:
            cmd: curl -fsSL https://mise.run | sh
          when: not mise_bin_check.stat.exists
        - name: Ensure Mise configuration directory exists
          ansible.builtin.file:
            path: "{{ user_home }}/.config/mise"
            state: directory
            mode: "0755"
          check_mode: false
        - name: Ensure Global Mise configuration (~/.config/mise/config.toml)
          ansible.builtin.copy:
            dest: "{{ user_home }}/.config/mise/config.toml"
            mode: "0644"
            content: |
              [tools]
              # Dotfiles Pre-Commit Hook Dependencies & Shell Baseline
              "aqua:tealdeer-rs/tealdeer" = "latest"
              navi = "latest"
              node = "latest"
              pre-commit = "latest"
              python = "latest"
              rtk = "latest"
              ruff = "latest"
              shellcheck = "latest"
              trufflehog = "latest"
              yamlfmt = "latest"

              [settings]
              experimental = true
        - name: Run mise install for global pre-commit dependencies
          ansible.builtin.shell:
            cmd: "{{ user_home }}/.local/bin/mise install"
          environment:
            PATH: "{{ system_user_path }}"
    # =========================================================================
    # 5. Linuxbrew Fallback Packages
    # =========================================================================
    - name: 5. Configure Linuxbrew (Fallback Tools)
      block:
        - name: Check if Homebrew is installed
          ansible.builtin.stat:
            path: "/home/linuxbrew/.linuxbrew/bin/brew"
          register: brew_check
        - name: Ensure Linuxbrew parent directory exists
          become: true
          ansible.builtin.file:
            path: /home/linuxbrew
            state: directory
            owner: "{{ user_name }}"
            group: "{{ user_name }}"
            mode: "0755"
          when: not brew_check.stat.exists
        - name: Install Homebrew if missing
          ansible.builtin.shell:
            cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          when: not brew_check.stat.exists
          environment:
            NONINTERACTIVE: "1"
        - name: Ensure Homebrew is in zshrc
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.zshrc"
            line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
            create: true
            # - name: Install supplemental Homebrew packages
            #   community.general.homebrew:
            #     name: "{{ homebrew_packages }}"
            #     state: present
            #     path: "/home/linuxbrew/.linuxbrew/bin"
            #   when: homebrew_packages | length > 0
    # =========================================================================
    # 6. User Environment (Fonts, Oh-My-Zsh, Tmux, CLI Tools)
    # =========================================================================
    - name: 6. Configure User Shell & Fonts
      block:
        - name: Create font directory
          ansible.builtin.file:
            path: "{{ user_home }}/.local/share/fonts"
            state: directory
            mode: "0755"
          check_mode: false
        - name: Install Cascadia Code Nerd Font
          ansible.builtin.unarchive:
            src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ font_version }}/CascadiaCode.zip"
            dest: "{{ user_home }}/.local/share/fonts"
            remote_src: true
        - name: Clone Oh-My-Zsh
          ansible.builtin.git:
            repo: https://github.com/ohmyzsh/ohmyzsh.git
            dest: "{{ user_home }}/.oh-my-zsh"
            depth: 1
            update: false
        - name: Clone zsh-autosuggestions
          ansible.builtin.git:
            repo: https://github.com/zsh-users/zsh-autosuggestions
            dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
            depth: 1
            update: false
        - name: Install Tmux Package Manager (TPM)
          ansible.builtin.git:
            repo: https://github.com/tmux-plugins/tpm
            dest: "{{ user_home }}/.config/tmux/plugins/tpm"
            depth: 1
            update: false
        - name: Check if tmux is available
          ansible.builtin.shell:
            cmd: command -v tmux
          register: tmux_check
          changed_when: false
          failed_when: false
        - name: Report pending tmux activation
          ansible.builtin.debug:
            msg: >-
              tmux has been requested through rpm-ostree but is not available in the current deployment. Reboot and rerun the playbook to install TPM plugins.
          when: tmux_check.rc != 0
        - name: Execute headless TPM plugin installation
          ansible.builtin.shell:
            cmd: "{{ user_home }}/.config/tmux/plugins/tpm/bin/install_plugins"
          register: tpm_install
          changed_when: "'Installing' in tpm_install.stdout"
          when: tmux_check.rc == 0
        - name: Ensure Cargo bin is in PATH via zshrc
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.zshrc"
            line: 'export PATH="$HOME/.cargo/bin:$PATH"'
            create: true
        - name: Create global npm directory
          ansible.builtin.file:
            path: "{{ user_home }}/.npm-global"
            state: directory
            mode: "0755"
          check_mode: false
        - name: Read current NPM prefix
          ansible.builtin.command:
            cmd: >-
              {{ user_home }}/.local/bin/mise exec -- npm config get prefix
          environment:
            PATH: "{{ system_user_path }}"
          register: npm_prefix
          changed_when: false
        - name: Configure NPM Prefix
          ansible.builtin.command:
            cmd: >-
              {{ user_home }}/.local/bin/mise exec -- npm config set prefix {{ user_home }}/.npm-global
          environment:
            PATH: "{{ system_user_path }}"
          when: npm_prefix.stdout != user_home + '/.npm-global'
        - name: Install pi and codex CLI agents via npm
          ansible.builtin.command:
            cmd: >-
              {{ user_home }}/.local/bin/mise exec -- npm install -g @earendil-works/pi-coding-agent @openai/codex
          environment:
            PATH: "{{ system_user_path }}"
          register: npm_agents
          changed_when: >-
            'added' in npm_agents.stdout or 'updated' in npm_agents.stdout or 'changed' in npm_agents.stdout
        - name: Check if Antigravity CLI (agy) is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/bin/agy"
          register: agy_bin_check
        - name: Install Antigravity CLI (agy)
          ansible.builtin.shell:
            cmd: "curl -fsSL https://antigravity.google/cli/install.sh | bash"
          when: not agy_bin_check.stat.exists
        - name: Ensure mise activation in .zshrc
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.zshrc"
            line: 'eval "$({{ user_home }}/.local/bin/mise activate zsh)"'
            create: true
            state: present
