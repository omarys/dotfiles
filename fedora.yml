- name: Provision Fedora Workstation
  hosts: localhost
  connection: local
  become: false
  vars:
    user_name: "{{ ansible_facts['user_id'] | default('omary') }}"
    user_home: "{{ ansible_facts['env']['HOME'] | default('/home/' + user_name) }}"
    user_env:
      PATH: "{{ user_home }}/.local/bin:{{ user_home }}/.cargo/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
      NONINTERACTIVE: "1"
    font_version: "v3.4.0"
    core_packages:
      - cargo
      - clang-devel
      - curl
      - dnf-plugins-core
      - emacs-pgtk
      - file
      - fzf
      - ghostty
      - git
      - gnome-tweaks
      - gnupg2
      - keepassxc
      - make
      - mpv
      - neovim
      - opensc
      - openssl
      - pass
      - pcsc-lite
      - pcsc-lite-ccid
      - pcsc-tools
      - procps-ng
      - python3-neovim
      - ripgrep
      - rust
      - steam
      - stow
      - unzip
      - util-linux-user
      - zsh
    # GUI Applications via Flatpak (Flathub User/System)
    flatpak_packages:
      - com.mattermost.Desktop
      - info.febvre.Komikku
      - org.gnome.Aisleriot
      - org.gnome.Mahjongg
      - org.gnome.Podcasts
      - org.gnome.Solanum
      - us.zoom.Zoom
    # Homebrew fallback packages (only those not covered by mise or cargo)
    homebrew_packages:
      - docker-credential-helper
      - ksops
  tasks:
    # =========================================================================
    # 1. System Packages & Repositories (DNF, RPM Fusion, Terra, Ghostty)
    # =========================================================================
    - name: 1. Install System Repositories and Core Packages
      become: true
      block:
        - name: Install RPM Fusion Free
          ansible.builtin.dnf:
            name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
            state: present
            disable_gpg_check: true
        - name: Install RPM Fusion Non-Free
          ansible.builtin.dnf:
            name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
            state: present
            disable_gpg_check: true
        - name: Add Terra Repository
          ansible.builtin.get_url:
            url: https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
            dest: /etc/yum.repos.d/terra.repo
            mode: "0644"
        - name: Install Terra Release Package
          ansible.builtin.dnf:
            name: terra-release
            state: present
            update_cache: true
        - name: Enable Ghostty COPR Repository
          community.general.copr:
            name: scottames/ghostty
            state: enabled
        - name: Install Development Tools Group
          ansible.builtin.dnf:
            name: "@development-tools"
            state: present
        - name: Install System Packages
          ansible.builtin.dnf:
            name: "{{ core_packages }}"
            state: present

    # =========================================================================
    # 2. Docker CE Setup
    # =========================================================================
    - name: 2. Configure Docker CE
      become: true
      block:
        - name: Purge old Docker versions
          ansible.builtin.dnf:
            name: [docker, docker-client, docker-common, docker-latest, docker-engine]
            state: absent
        - name: Add Docker CE Repository
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/fedora/docker-ce.repo
            dest: /etc/yum.repos.d/docker-ce.repo
            mode: "0644"
        - name: Install Docker CE
          ansible.builtin.dnf:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
            state: present
            update_cache: true
        - name: Enable Docker Service
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started
            daemon_reload: true
        - name: Add User to Docker Group
          ansible.builtin.user:
            name: "{{ user_name }}"
            groups: docker
            append: true

    # =========================================================================
    # 3. Flatpak Applications & Standalone Firefox
    # =========================================================================
    - name: 3. Install GUI Applications via Flatpak
      block:
        - name: Ensure Flatpak package manager is installed
          become: true
          ansible.builtin.dnf:
            name: flatpak
            state: present
        - name: Ensure Flathub repository is configured
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
            method: user
        - name: Install Flatpak applications
          community.general.flatpak:
            name: "{{ item }}"
            state: present
            remote: flathub
            method: user
          loop: "{{ flatpak_packages }}"
        - name: Remove default Flatpak Firefox (in favor of Standalone Native Firefox)
          community.general.flatpak:
            name: org.mozilla.firefox
            state: absent
            method: "{{ item }}"
          loop:
            - system
            - user
          ignore_errors: true
        - name: Remove Flatpak KeePassXC (in favor of RPM KeePassXC)
          community.general.flatpak:
            name: org.keepassxc.KeePassXC
            state: absent
            method: "{{ item }}"
          loop:
            - system
            - user
          ignore_errors: true

    - name: Configure Mozilla Firefox (Standalone Native Edition)
      block:
        - name: Ensure ~/.local directories exist
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ user_home }}/.local/lib"
            - "{{ user_home }}/.local/bin"
            - "{{ user_home }}/.local/share/applications"
        - name: Check if Standalone Firefox is already installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/lib/firefox/firefox"
          register: firefox_bin_check
        - name: Download Mozilla Firefox Standalone Tarball
          ansible.builtin.get_url:
            url: "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
            dest: "/tmp/firefox.tar.xz"
            mode: "0644"
          when: not firefox_bin_check.stat.exists
        - name: Extract Mozilla Firefox Standalone
          ansible.builtin.unarchive:
            src: "/tmp/firefox.tar.xz"
            dest: "{{ user_home }}/.local/lib"
            remote_src: true
          when: not firefox_bin_check.stat.exists
        - name: Clean up temporary Firefox archive
          ansible.builtin.file:
            path: "/tmp/firefox.tar.xz"
            state: absent
          when: not firefox_bin_check.stat.exists
        - name: Symlink Firefox executable to ~/.local/bin/firefox
          ansible.builtin.file:
            src: "{{ user_home }}/.local/lib/firefox/firefox"
            dest: "{{ user_home }}/.local/bin/firefox"
            state: link
            force: true
        - name: Create Desktop Entry for Standalone Firefox
          ansible.builtin.copy:
            dest: "{{ user_home }}/.local/share/applications/firefox.desktop"
            mode: "0644"
            content: |
              [Desktop Entry]
              Version=1.0
              Name=Firefox
              Comment=Browse the World Wide Web
              GenericName=Web Browser
              Keywords=Internet;WWW;Browser;Web;Explorer
              Exec={{ user_home }}/.local/bin/firefox %u
              Terminal=false
              X-MultipleArgs=false
              Type=Application
              Icon={{ user_home }}/.local/lib/firefox/browser/chrome/icons/default/default128.png
              Categories=Network;WebBrowser;
              MimeType=text/html;text/xml;application/xhtml+xml;application/xml;application/rss+xml;application/rdf+xml;image/gif;image/jpeg;image/png;x-scheme-handler/http;x-scheme-handler/https;x-scheme-handler/ftp;x-scheme-handler/chrome;video/webm;application/x-xpinstall;
              StartupNotify=true
              StartupWMClass=firefox
              Actions=new-window;new-private-window;

              [Desktop Action new-window]
              Name=Open a New Window
              Exec={{ user_home }}/.local/bin/firefox -new-window

              [Desktop Action new-private-window]
              Name=Open a New Private Window
              Exec={{ user_home }}/.local/bin/firefox -private-window
        - name: Ensure ~/.mozilla/native-messaging-hosts directory exists
          ansible.builtin.file:
            path: "{{ user_home }}/.mozilla/native-messaging-hosts"
            state: directory
            mode: "0755"
        - name: Configure KeePassXC Native Messaging Host for Mozilla Firefox
          ansible.builtin.copy:
            dest: "{{ user_home }}/.mozilla/native-messaging-hosts/org.keepassxc.keepassxc_browser.json"
            mode: "0644"
            content: |
              {
                  "allowed_extensions": [
                      "keepassxc-browser@keepassxc.org"
                  ],
                  "description": "KeePassXC integration with native messaging support",
                  "name": "org.keepassxc.keepassxc_browser",
                  "path": "/usr/bin/keepassxc-proxy",
                  "type": "stdio"
              }

    # =========================================================================
    # 4. Mise Installation and Scoped Toolchains
    # =========================================================================
    - name: 4. Configure Mise & Pre-Commit Dependencies
      block:
        - name: Check if Mise is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/bin/mise"
          register: mise_bin_check
        - name: Install Mise via official standalone installer
          ansible.builtin.shell:
            cmd: curl -fsSL https://mise.run | sh
          when: not mise_bin_check.stat.exists
        - name: Ensure Mise configuration directory exists
          ansible.builtin.file:
            path: "{{ user_home }}/.config/mise"
            state: directory
            mode: "0755"
        - name: Ensure Global Mise configuration (~/.config/mise/config.toml)
          ansible.builtin.copy:
            dest: "{{ user_home }}/.config/mise/config.toml"
            mode: "0644"
            content: |
              [tools]
              # Dotfiles Pre-Commit Hook Dependencies & Shell Baseline
              "aqua:tealdeer-rs/tealdeer" = "1.8.1"
              aube = "1.41.0"
              navi = "2.24.0"
              node = "26.7.0"
              pre-commit = "4.6.2"
              python = "3.14.7"
              rtk = "0.45.0"
              ruff = "0.16.3"
              shellcheck = "0.11.0"
              trufflehog = "3.97.0"
              yamlfmt = "0.21.0"

              [settings]
              experimental = true
        - name: Run mise install for global pre-commit dependencies
          ansible.builtin.shell:
            cmd: "{{ user_home }}/.local/bin/mise install"
          environment:
            PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    # =========================================================================
    # 5. Linuxbrew Fallback Packages
    # =========================================================================
    - name: 5. Configure Linuxbrew (Fallback Tools)
      block:
        - name: Check if Homebrew is installed
          ansible.builtin.stat:
            path: "/home/linuxbrew/.linuxbrew/bin/brew"
          register: brew_check
        - name: Install Homebrew if missing
          ansible.builtin.shell:
            cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          when: not brew_check.stat.exists
          environment:
            NONINTERACTIVE: "1"
        - name: Ensure Homebrew is in zshrc
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.zshrc"
            line: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'
            create: true
        - name: Install supplemental Homebrew packages
          community.general.homebrew:
            name: "{{ homebrew_packages }}"
            state: present
            path: "/home/linuxbrew/.linuxbrew/bin"
          when: homebrew_packages | length > 0

    # =========================================================================
    # 6. User Environment (Fonts, Oh-My-Zsh, Tmux, CLI Tools)
    # =========================================================================
    - name: 6. Configure User Shell & Fonts
      block:
        - name: Create font directory
          ansible.builtin.file:
            path: "{{ user_home }}/.local/share/fonts"
            state: directory
            mode: "0755"
        - name: Install Cascadia Code Nerd Font
          ansible.builtin.unarchive:
            src: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ font_version }}/CascadiaCode.zip"
            dest: "{{ user_home }}/.local/share/fonts"
            remote_src: true
        - name: Clone Oh-My-Zsh
          ansible.builtin.git:
            repo: https://github.com/ohmyzsh/ohmyzsh.git
            dest: "{{ user_home }}/.oh-my-zsh"
            depth: 1
        - name: Clone zsh-autosuggestions
          ansible.builtin.git:
            repo: https://github.com/zsh-users/zsh-autosuggestions
            dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
            depth: 1
        - name: Install Tmux Package Manager (TPM)
          ansible.builtin.git:
            repo: https://github.com/tmux-plugins/tpm
            dest: "{{ user_home }}/.config/tmux/plugins/tpm"
            depth: 1
        - name: Execute headless TPM plugin installation
          ansible.builtin.shell:
            cmd: "{{ user_home }}/.config/tmux/plugins/tpm/bin/install_plugins"
          register: tpm_install
          changed_when: "'Installing' in tpm_install.stdout"
          ignore_errors: true
        - name: Install Yazi from git source
          ansible.builtin.shell:
            cmd: "cargo install --force --git https://github.com/sxyazi/yazi.git yazi-build"
          environment:
            PATH: "{{ user_home }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
          args:
            creates: "{{ user_home }}/.cargo/bin/yazi"
        - name: Create global npm directory
          ansible.builtin.file:
            path: "{{ user_home }}/.npm-global"
            state: directory
            mode: "0755"
        - name: Configure NPM Prefix
          ansible.builtin.shell:
            cmd: "npm config set prefix '~/.npm-global'"
        - name: Install pi and codex CLI agents via npm
          ansible.builtin.shell:
            cmd: "npm install -g @earendil-works/pi-coding-agent @openai/codex"
          environment:
            PATH: "{{ user_home }}/.npm-global/bin:{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
          register: npm_agents
          changed_when: "'added' in npm_agents.stdout or 'updated' in npm_agents.stdout"
        - name: Check if Antigravity CLI (agy) is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.local/bin/agy"
          register: agy_bin_check
        - name: Install Antigravity CLI (agy)
          ansible.builtin.shell:
            cmd: "curl -fsSL https://antigravity.google/install.sh | sh"
          when: not agy_bin_check.stat.exists
        - name: Ensure mise activation in .zshrc
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.zshrc"
            line: 'eval "$({{ user_home }}/.local/bin/mise activate zsh)"'
            create: true
            state: present

    # =========================================================================
    # 7. Doom Emacs and LazyVim
    # =========================================================================
    - name: 7. Configure Doom Emacs and LazyVim
      block:
        - name: Check if Doom Emacs is installed
          ansible.builtin.stat:
            path: "{{ user_home }}/.config/emacs/bin/doom"
          register: doom_bin_check
        - name: Check if ~/.config/emacs is a symlink or non-git directory
          ansible.builtin.stat:
            path: "{{ user_home }}/.config/emacs"
          register: emacs_dir_check
          when: not doom_bin_check.stat.exists
        - name: Remove symlinked ~/.config/emacs before cloning Doom Emacs
          ansible.builtin.file:
            path: "{{ user_home }}/.config/emacs"
            state: absent
          when:
            - not doom_bin_check.stat.exists
            - emacs_dir_check.stat.exists is defined
            - emacs_dir_check.stat.exists
            - emacs_dir_check.stat.islnk | default(false)
        - name: Clone Doom Emacs Framework
          ansible.builtin.git:
            repo: https://github.com/doomemacs/doomemacs
            dest: "{{ user_home }}/.config/emacs"
            depth: 1
          when: not doom_bin_check.stat.exists
        - name: Sync Doom Emacs packages
          ansible.builtin.shell:
            cmd: "{{ user_home }}/.config/emacs/bin/doom sync -u"
          environment:
            PATH: "{{ user_home }}/.local/bin:{{ user_home }}/.config/emacs/bin:{{ ansible_facts['env']['PATH'] }}"
          ignore_errors: true
          register: doom_sync
          changed_when: "'Installing' in doom_sync.stdout or 'Updating' in doom_sync.stdout"
        - name: Fetch LazyVim Starter Template to temporary directory
          ansible.builtin.git:
            repo: https://github.com/LazyVim/starter
            dest: "/tmp/lazyvim_starter"
            depth: 1
        - name: Merge LazyVim template with stowed overrides
          ansible.builtin.shell:
            cmd: "cp -rn /tmp/lazyvim_starter/* {{ user_home }}/.config/nvim/"
        - name: Check if neovim is executable
          ansible.builtin.shell:
            cmd: command -v nvim || {{ user_home }}/.local/bin/mise which neovim || true
          register: nvim_check
          changed_when: false
        - name: Headless LazyVim plugin installation
          ansible.builtin.shell:
            cmd: "{{ nvim_check.stdout }} --headless '+Lazy! sync' +qa"
          when: nvim_check.stdout != ""
          args:
            creates: "{{ user_home }}/.local/share/nvim/lazy"

