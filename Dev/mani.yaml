specs:
  custom:
    output: table
    parallel: true
    forks: 8
targets:
  all:
    all: true
tasks:
  psync:
    desc: Sync all repos in parallel
    spec: custom
    target: all
    cmd: mani sync --parallel
  git-status:
    desc: Show working tree
    spec: custom
    target: all
    cmd: git status -s
  git-pull:
    desc: Pull latest updates
    spec: custom
    target: all
    cmd: git pull
  git-fetch:
    desc: Fetch latest
    spec: custom
    target: all
    cmd: git fetch
